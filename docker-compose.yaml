services:
  postgres:
    image: postgres:17
    container_name: smartstock-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: smartstock
      POSTGRES_USER: smartstock_user
      POSTGRES_PASSWORD: smartstock_password

    ports:
      - "5433:5432"

    volumes:
      - smartstock_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartstock_user -d smartstock"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smartstock_postgres_data:ta: